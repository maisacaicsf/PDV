<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestok PDV</title><link rel="stylesheet" href="style.css"></head><body>
<div id="loginView" class="view"><div class="login-card"><div class="brand">Gesto<span>k</span><small>PDV</small></div><p class="muted">Acesso ao caixa</p><form id="loginForm"><label>Código do operador<input id="codigo" inputmode="numeric" maxlength="4" autocomplete="username" placeholder="0000" required></label><label>Senha<input id="senha" type="password" autocomplete="current-password" placeholder="Digite sua senha" required></label><button class="btn primary wide" type="submit">ENTRAR NO CAIXA</button><p id="loginError" class="error"></p><p class="login-note">PDV independente conectado ao Gestok.</p></form></div></div>
<div id="pdvView" class="view hidden"><header class="topbar"><div class="brand">Gesto<span>k</span><small>PDV</small></div><div class="top-info"><div><b id="caixaLabel">CAIXA 01</b><span id="lojaLabel">Loja</span></div><div class="operator"><span class="dot"></span><span id="operatorName">Operador</span><button id="logoutBtn" class="logout">Sair</button></div></div></header><main class="checkout"><section class="sale-panel"><div class="search-row"><div class="search-box"><span>⌕</span><input id="search" autofocus placeholder="Digite o código de barras ou nome do produto"></div><button id="clearSale" class="btn ghost">Limpar</button></div><div id="searchResults" class="search-results hidden"></div><div class="sale-head"><span>ITENS DA VENDA</span><span id="itemCount">0 itens</span></div><div id="cart" class="cart"></div><div id="emptyCart" class="empty"><div class="empty-icon">🛒</div><strong>Comece uma venda</strong><span>Digite o código de barras ou procure um produto pelo nome.</span></div></section><aside class="pay-panel"><div class="total-box"><span>TOTAL DA VENDA</span><strong id="total">R$ 0,00</strong></div><div class="payment-title">FORMA DE PAGAMENTO</div><div class="payments"><button data-pay="dinheiro" class="pay active">💵 Dinheiro</button><button data-pay="pix" class="pay">▣ PIX</button><button data-pay="debito" class="pay">💳 Débito</button><button data-pay="credito" class="pay">💳 Crédito</button></div><div id="receivedWrap" class="received"><label>Valor recebido<input id="received" inputmode="decimal" placeholder="0,00"></label><div class="change"><span>Troco</span><b id="change">R$ 0,00</b></div></div><button id="finishBtn" class="finish" disabled>FINALIZAR VENDA <span>↵</span></button><div class="shortcuts"><span><b>F2</b> Buscar</span><span><b>ESC</b> Cancelar</span></div></aside></main><div id="toast" class="toast"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script type="module" src="app.js"></script></body></html>
